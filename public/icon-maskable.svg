<?xml version="1.0" encoding="UTF-8"?>
<!-- Maskable source. Android crops launcher icons to whatever shape the OS uses
     (circle, squircle, rounded square), so the mark has to sit inside the
     "safe zone": the central 80% of the canvas. The favicon scales the house up
     to fill the square, which is right for a 16px browser tab and wrong here —
     the crop would eat the roof and the chimney.

     Here the house keeps its natural size inside the 1000x1000 box (already
     ~43% of the width, comfortably inside the safe circle) and the pink bleeds
     to the edges to fill whatever the OS crops to. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#ff007a"/>
  <g fill="#fff">
    <path d="M435.11,554.24c11.02-5.14,12.56-20.08,2.59-27.33-5.38-3.91-12.82-3.97-18.27-.17-10.26,7.16-8.71,22.28,2.37,27.6l-11.86,36.16h36.49l-11.32-36.27Z"/>
    <polygon points="499.22 286.17 285.94 498.84 285.94 666.78 357.29 595.42 357.29 529.09 499.22 387.72 642.71 529.09 642.71 642.53 411.05 642.53 339.74 713.83 714.06 713.83 714.06 498.84 499.22 286.17"/>
    <polygon points="672.25 435.91 672.25 384.61 619.08 331.43 619.08 382.73 672.25 435.91"/>
  </g>
</svg>
